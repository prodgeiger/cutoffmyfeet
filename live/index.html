<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAVE THE FEET!</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.ico">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #000; color: #fff; display: grid; place-items: center; font-family: "Courier New", monospace; padding: 12px; }
  .game { width: 100%; max-width: 520px; text-align: center; }
  canvas { width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; border: 4px ridge #666; display: block; touch-action: none; }
  .ctl { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .ctl button { font: bold 18px "Courier New", monospace; padding: 8px 18px; background: #c0c0c0; border: 3px outset #fff; color: #000; }
  .ctl button:active { border-style: inset; }
  .hint { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<div class="game">
  <canvas id="cv" width="240" height="180"></canvas>
  <div class="ctl"><button id="bl">&#9664;</button><button id="bs">START</button><button id="br">&#9654;</button></div>
  <div class="hint">ARROW KEYS or A/D to move &middot; SPACE to start</div>
  <div class="hint">HIGH SCORE: <span id="hi">0</span></div>
</div>
<script>
/* ===== SAVE THE FEET! =====
   Move a pair of feet left and right. Blades drop from above after a short warning.
   Survive as long as you can. */
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const W = 240, H = 180, FLOOR = 160;
let st, keys = {}, best = 0;
try { best = parseInt(localStorage.getItem('cmf_hi') || '0', 10); } catch (e) {}
document.getElementById('hi').textContent = best;

function reset() { st = { x: 120, blades: [], t: 0, score: 0, spawn: 0, rate: 70, over: false, run: true, flash: 0 }; }
function px(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, w | 0, h | 0); }
function drawFeet(x) {
  // two little pixel feet, sticking out to the right
  [[-14, 0], [4, 0]].forEach(([dx]) => {
    px(x + dx, FLOOR - 16, 6, 12, '#f6d6ae');           // ankle
    px(x + dx, FLOOR - 6, 12, 6, '#f6d6ae');            // foot
    px(x + dx + 10, FLOOR - 6, 2, 2, '#e88');           // toe
    px(x + dx, FLOOR - 17, 6, 2, '#2a4a9a');            // sock cuff
  });
}
function drawBlade(b) {
  if (b.y < 0) {                                        // warning shadow
    if ((st.t >> 2) % 2) px(b.x - 9, FLOOR - 2, 18, 2, '#f00');
    px(b.x - 1, 0, 2, 8, '#f00');
    return;
  }
  px(b.x - 10, b.y - 20, 20, 4, '#8b6436');             // wooden top
  px(b.x - 9, b.y - 16, 18, 12, '#aab4bc');             // blade
  for (let i = 0; i < 18; i++) px(b.x - 9 + i, b.y - 4 + (i * 6 / 18 | 0), 1, 6 - (i * 6 / 18 | 0), '#dfe6ea'); // slanted edge
}
function frame() {
  if (!st || !st.run) { looping = false; return; }
  st.t++;
  const sp = 2.2;
  if (keys.ArrowLeft || keys.a || keys.A || keys.L) st.x -= sp;
  if (keys.ArrowRight || keys.d || keys.D || keys.R) st.x += sp;
  st.x = Math.max(18, Math.min(W - 18, st.x));
  if (!st.over) {
    st.score = st.t / 6 | 0;
    if (--st.spawn <= 0) {
      st.blades.push({ x: 12 + Math.random() * (W - 24), y: -40, v: 0 });
      st.rate = Math.max(22, st.rate - 1.5); st.spawn = st.rate;
    }
    st.blades.forEach(b => { b.y += b.y < 0 ? 1 : (b.v += .35); });
    st.blades = st.blades.filter(b => b.y < FLOOR + 30);
    for (const b of st.blades) {
      if (b.y > FLOOR - 18 && b.y < FLOOR + 4 && Math.abs(b.x - st.x) < 20) { st.over = true; st.flash = 10; gameOver(); break; }
    }
  }
  // draw
  px(0, 0, W, H, '#0b0b14');
  for (let i = 0; i < 24; i++) px((i * 37 + st.t * .2) % W, (i * 53) % 120, 1, 1, '#556');
  px(0, FLOOR, W, H - FLOOR, '#2b5aa8');                 // blue tarp
  for (let i = 0; i < W; i += 12) px(i, FLOOR, 6, 1, '#3d70c4');
  st.blades.forEach(drawBlade);
  if (!st.over || (st.t >> 3) % 2) drawFeet(st.x);
  g.fillStyle = '#ff0'; g.font = '10px monospace'; g.fillText('SCORE ' + st.score, 6, 12);
  if (st.flash > 0) { px(0, 0, W, H, 'rgba(255,0,0,' + st.flash / 20 + ')'); st.flash--; }
  if (st.over) {
    g.fillStyle = '#fff'; g.font = 'bold 18px monospace'; g.textAlign = 'center';
    g.fillText('CHOP!', W / 2, 70); g.font = '10px monospace'; g.fillText('score: ' + st.score + '   press START', W / 2, 90); g.textAlign = 'left';
  }
  requestAnimationFrame(frame);
}
function gameOver() {
  if (st.score > best) { best = st.score; try { localStorage.setItem('cmf_hi', best); } catch (e) {} document.getElementById('hi').textContent = best; }
}
let looping = false;
function start() { reset(); if (!looping) { looping = true; requestAnimationFrame(frame); } }
function title() {
  px(0, 0, W, H, '#0b0b14'); px(0, FLOOR, W, H - FLOOR, '#2b5aa8');
  st = { x: 120, t: 0 }; drawFeet(120);
  g.fillStyle = '#ff0'; g.font = 'bold 16px monospace'; g.textAlign = 'center';
  g.fillText('SAVE THE FEET!', W / 2, 60); g.fillStyle = '#fff'; g.font = '10px monospace'; g.fillText('press START', W / 2, 80); g.textAlign = 'left';
  st = null;
}
title();
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (e.key === ' ') { if (!st || st.over) start(); return; }
  keys[e.key] = true;
});
addEventListener('keyup', e => { keys[e.key] = false; });
document.getElementById('bs').addEventListener('click', () => { if (!st || st.over) start(); });
[['bl', 'L'], ['br', 'R']].forEach(([id, k]) => {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[k] = true; }, off = () => { keys[k] = false; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off);
});
</script>
</body>
</html>
